[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-color-contrast-wcag-auditor"
version = "0.1.0"
description = "Automated WCAG 2.1 AA/AAA color contrast ratio calculator and palette optimizer"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-color-contrast-wcag-auditor = "agent_color_contrast_wcag_auditor.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_color_contrast_wcag_auditor*"]
